<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.container { /* elemento pai father */
            background-color: aqua;
          
            display : flex;
            flex-flow: row rowrap;
        }


        div.item {  /* elemento filho child */
            background-color: orange;
            border: 1px solid black;
            text-align: center;
            /*flex-basis: auto;*/
            flex-basis: 150px;
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">Outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">outro conteúdo um pouca maior</div>
        <div class="item">E</div>
        <div class="item">Another section a little big</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>
