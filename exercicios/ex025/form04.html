<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.ph" method="get" autocomplete="on">

    <fieldset> <!-- faz o agrupamento dos campos abaixo / grupo de campos-->
        <legend>Dados Pessoais</legend>
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="Nome" id="inome"  minlength="5" maxlength="20" required>
        </p>
        <P>
            <label for="iemail">Email</label>
            <input type="email" name="email" id="iemail" required autocomplete="email">
        </P>
        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" placeholder="(xx)xxxx-xxxx" required> <!-- "^[0-9]{4}-[0-9]{4}$" ou "^\d{4,5}-\d{4}$" ou  com ddd "^\(\d{2}\)\d{4,5}-\d{4}$" -->
        </p>
    </fieldset>
    <!-- Estudar mais sobre RegEx -->

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    

    </form>
</body>
</html>
